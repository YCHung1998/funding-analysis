schema: spec-driven

# Project context — shown to AI when creating artifacts.
context: |
  Project: Cross-exchange crypto funding-rate arbitrage (delta-neutral: long the low-rate exchange,
  short the high-rate exchange, collect the funding spread).
  Stage: ① Research / ② Dry-run prototype → building ③ Paper Trading (no real orders, ever, until
  stage ⑤ is explicitly approved by the user).

  Source-of-truth documents (read before proposing):
    - docs/TRADING_SYSTEM_SPEC.md      Trading System Spec v0.2 (What). Decision log in §34.
    - docs/PAPER_TRADING_TECH_SPEC.md  Paper Trading tech spec (How). Build order §50.1, workflow §51.
    - assets/HANDOFF.md                Invariants (§3), Definition of Done (§5), backlog, handoff log.
    - issue/README.md                  25 reviewed issues (Q-*, BE-*, FE-*) with evidence.
  Sections marked "⚠️ 待決 C-xx" are undecided — do not implement them; ask the user.

  Tech stack: TypeScript, React 19 + Vite (research UI in src/), Express (server.ts),
  Node. Paper Trading Runtime is a separate Node process under runtime/ (SQLite, event-sourced).
  Scan exchanges: Pionex, Binance, Bybit, Bitget, OKX. Paper trading exchanges: Binance, Bybit (OKX later).
  Install: npm install --legacy-peer-deps. Test framework: vitest (to be set up, HANDOFF B0).
  Language: docs and proposals in Traditional Chinese; code identifiers and status codes in English.

  Branching: main (always runnable) ← develop ← feature-<change-name>. One OpenSpec change = one
  feature branch. Merge with --no-ff; rollback via git revert -m 1; tag every merge to main.

rules:
  proposal:
    - Reference the spec section(s) and decision IDs (C-xx) or issue IDs (Q-/BE-/FE-, HANDOFF P#/B#) it implements.
    - State the feature branch name (feature-<change-name>).
    - Include a Non-goals section.
  design:
    - Respect HANDOFF §3 invariants (no real orders, credentials only in .env.local, no exchange-name branches in strategy/engine, never assume 8h funding, rates stored as decimals, Cancel ≠ Close).
    - Every persisted entity has created_at/updated_at; every state transition emits a TradingEvent (spec §25).
  tasks:
    - Keep a change at ~12 tasks or fewer; otherwise split into two proposals.
    - Write a failing test before each formula / state-machine task (fail-then-pass evidence).
    - When migrating a legacy type, add characterization tests first; lint, build and test must stay green after every task (spec §2.1).
    - Final task: npm run lint && npm run build && npm test, then update HANDOFF §7.
